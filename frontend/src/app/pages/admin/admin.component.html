<main class="container admin-dashboard inner">
    <header class="dashboard-heading">
        <div>
            <p class="eyebrow">L'espace de gestion d'Amy</p>
            <h1>Tableau de <i>bord</i></h1>
            <p class="dashboard-subtitle">Une vue claire des commandes et de l'activité de l'atelier.</p>
        </div>
        <a class="btn btn-rose dashboard-create" routerLink="/administration/produits">+ Nouvelle création</a>
    </header>
    @if (store.user()?.role !== 'ROLE_ADMIN') {
    <p class="admin-alert" role="alert">Cet espace est réservé à l’administratrice. <a routerLink="/mon-compte">Se
            connecter</a></p>
    } @else {
    <app-admin-navigation />
    <app-dashboard-metrics [summary]="summary" />
    <app-orders-table [orders]="orders" [loading]="loading" [saving]="saving" [error]="error" (refresh)="load()"
        (statusChange)="updateStatus($event)" (paymentChange)="updatePayment($event)" />
    }
</main>
