spring:
  application:
    name: lpada-api
  datasource:
    # Supabase: utiliser l'URI JDBC de connexion directe ou du pooler en mode session.
    # Ne jamais mettre de secrets dans le dépôt / frontend.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      connection-timeout: 15000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        name: LPADA_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
management:
  endpoints:
    enabled-by-default: false
